<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Terrane — Maps for the places that matter.">
    <defs>
        <radialGradient id="glow" cx="78%" cy="30%" r="60%">
            <stop offset="0%" stop-color="#cd7b41" stop-opacity="0.18" />
            <stop offset="55%" stop-color="#cd7b41" stop-opacity="0.05" />
            <stop offset="100%" stop-color="#cd7b41" stop-opacity="0" />
        </radialGradient>
    </defs>

    <!-- Background -->
    <rect x="0" y="0" width="1200" height="630" fill="#0b1c29" />
    <rect x="0" y="0" width="1200" height="630" fill="url(#glow)" />

    <!-- Subtle rust accent element: nested concentric contour rings (the Terrane logo motif) -->
    <g fill="none" stroke="#cd7b41" stroke-width="6" stroke-linejoin="round" transform="translate(910 315)">
        <path d="M0 -240 C 132.6 -240, 240 -132.6, 240 0 C 240 132.6, 132.6 240, 0 240 C -132.6 240, -240 132.6, -240 0 C -240 -132.6, -132.6 -240, 0 -240 Z" opacity="0.20" />
        <path d="M0 -170 C 93.9 -170, 170 -93.9, 170 0 C 170 93.9, 93.9 170, 0 170 C -93.9 170, -170 93.9, -170 0 C -170 -93.9, -93.9 -170, 0 -170 Z" opacity="0.35" />
        <path d="M0 -100 C 55.2 -100, 100 -55.2, 100 0 C 100 55.2, 55.2 100, 0 100 C -55.2 100, -100 55.2, -100 0 C -100 -55.2, -55.2 -100, 0 -100 Z" opacity="0.55" />
    </g>

    <!-- Rust accent bar -->
    <rect x="110" y="238" width="72" height="6" rx="3" fill="#cd7b41" />

    <!-- Wordmark -->
    <text x="108" y="345" font-family="'Archivo', 'Helvetica Neue', Arial, sans-serif" font-size="132" font-weight="800" letter-spacing="18" fill="#f2ead6">TERRANE</text>

    <!-- Tagline -->
    <text x="112" y="410" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="38" font-weight="400" letter-spacing="1.5" fill="#cd7b41">Maps for the places that matter.</text>

    <!-- Domain -->
    <text x="112" y="470" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="22" font-weight="500" letter-spacing="3" fill="#f2ead6" fill-opacity="0.6">WWW.TERRANEMAPS.COM</text>
</svg>
