name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Run tests
        # MONGO_URL / DB_NAME are read at import time; the pure-function suite
        # never opens a connection, so placeholders are enough.
        env:
          MONGO_URL: mongodb://localhost:27017
          DB_NAME: terrane_test
        run: python -m pytest tests -v

  frontend:
    name: Frontend (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Build
        # CI=false so pre-existing lint warnings don't fail the production
        # build; this job guards that the app still compiles and bundles.
        run: CI=false yarn build
